[workspace]
members = ["app", "crates/*"]
resolver = "2"

[workspace.lints.clippy]
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

# Keeps our own crates' debug info locally; drops it for third-party deps (AWS SDK) to shrink target/.
[profile.dev.package."*"]
debug = false
