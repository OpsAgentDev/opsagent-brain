services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: loco
      POSTGRES_PASSWORD: loco
      POSTGRES_DB: opsagent_brain_development
    ports: ["${PG_PORT:-5432}:5432"]
    volumes: [pg-data:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["${REDIS_PORT:-6379}:6379"]
  mailpit:
    image: axllent/mailpit
    ports: ["1025:1025", "8025:8025"]

volumes:
  pg-data:
