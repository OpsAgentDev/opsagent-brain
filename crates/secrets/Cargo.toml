[package]
name = "opsagent-secrets"
version = "0.1.0"
edition = "2021"
publish = false

# Pure library crate: no framework deps (see scripts/check-crate-isolation.sh).
[dependencies]
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
zeroize = "1"
rand = "0.8"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
serde = { version = "1", features = ["derive"] }
