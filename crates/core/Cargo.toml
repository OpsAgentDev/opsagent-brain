[package]
name = "opsagent-core"
version = "0.1.0"
edition = "2021"
publish = false

# Domain crate: keep framework-free (see scripts/check-crate-isolation.sh).
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
async-trait = "0.1"
rust_decimal = "1"
sha2 = "0.10"
base64 = "0.22"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
