[package]
name = "opsagent-ledger"
version = "0.1.0"
edition = "2021"
publish = false

# Domain crate: keep framework-free (see scripts/check-crate-isolation.sh).
[dependencies]
opsagent-core = { path = "../core" }
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
async-trait = "0.1"
redis = { version = "0.32", features = ["tokio-comp", "aio", "connection-manager"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
tracing = "0.1"
rand = "0.8"

[features]
# Test doubles (in-memory storage, kill switch) for this and other crates' tests.
test-support = []

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
opsagent-ledger = { path = ".", features = ["test-support"] }

[lints]
workspace = true
