[package]
name = "opsagent-connectors"
version = "0.1.0"
edition = "2021"
publish = false

# Domain crate: keep framework-free (see scripts/check-crate-isolation.sh).
[dependencies]
opsagent-core = { path = "../core" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v7", "serde"] }
thiserror = "1"
tokio = { version = "1", features = ["rt", "macros"] }
