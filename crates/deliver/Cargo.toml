[package]
name = "opsagent-deliver"
version = "0.1.0"
edition = "2021"
publish = false

# Domain crate: keep framework-free (see scripts/check-crate-isolation.sh). Pure: no I/O, no logging.
[dependencies]
opsagent-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v7", "serde"] }
askama = "0.14"

[lints]
workspace = true
