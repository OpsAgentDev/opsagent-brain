{% extends "layout.html" %}
{% block title %}{{ heading }}{% endblock %}
{% block content %}
<h1 style="margin:0 0 16px 0;font-size:22px;line-height:28px;font-weight:700;color:#0b1020;">{{ heading }}</h1>
{% for p in paragraphs %}<p style="margin:0 0 16px 0;font-size:16px;line-height:24px;color:#1f2937;">{{ p }}</p>
{% endfor %}
{% if let Some((label, url)) = button %}
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:8px 0 8px 0;"><tr><td style="background-color:#22d3ee;border-radius:6px;"><a href="{{ url }}" style="display:inline-block;padding:12px 24px;font-size:16px;font-weight:700;line-height:20px;color:#0b1020;text-decoration:none;">{{ label }}</a></td></tr></table>
{% endif %}
{% if let Some(f) = footnote %}<p style="margin:16px 0 0 0;font-size:13px;line-height:20px;color:#6b7280;">{{ f }}</p>{% endif %}
{% endblock %}
