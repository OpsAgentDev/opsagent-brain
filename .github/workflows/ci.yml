name: ci
# Fail fast: cheap gates first, then tests and one image build, then the jobs that boot that image.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: Post-deploy smoke target, e.g. https://brain.opsagent.dev (run after a Railway deploy)
        required: true

# A new push to the same branch cancels the run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Smaller artifacts: the AWS SDK crates otherwise fill the runner disk.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: -C link-arg=-fuse-ld=lld
  DATABASE_URL: postgres://loco:loco@localhost:5432/opsagent_brain_test
  REDIS_URL: redis://localhost:6379

jobs:
  # Seconds for the scripts and fmt, minutes for clippy. Everything else waits on this.
  lint:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build-room
      # Runner DNS to the Ubuntu mirrors fails now and then: retry before giving up.
      - run: for i in 1 2 3 4 5; do sudo apt-get update && sudo apt-get install -y lld && break || { [ $i = 5 ] && exit 1; sleep 30; }; done
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: scripts/check-crate-isolation.sh
      - run: scripts/check-tenancy.sh
      - run: scripts/check-logging.sh
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: loco
          POSTGRES_PASSWORD: loco
          POSTGRES_DB: opsagent_brain_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U loco" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build-room
      # Runner DNS to the Ubuntu mirrors fails now and then: retry before giving up.
      - run: for i in 1 2 3 4 5; do sudo apt-get update && sudo apt-get install -y lld && break || { [ $i = 5 ] && exit 1; sleep 30; }; done
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace
      - run: scripts/openapi-diff.sh

  # One release build, shared by the boot jobs below.
  image:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build-room
      - run: docker build -t opsagent-brain:ci .
      - run: docker save opsagent-brain:ci | gzip > brain-image.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: brain-image
          path: brain-image.tar.gz
          retention-days: 1

  backup-image:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build deploy/backup

  # The production image: refuses to boot with no variables; serves /readyz with a complete set.
  production-boot:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: loco, POSTGRES_PASSWORD: loco, POSTGRES_DB: opsagent_brain_prod }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U loco" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: brain-image
      - run: docker load < brain-image.tar.gz && docker tag opsagent-brain:ci brain
      - name: "No variables: non-zero exit naming the missing variable"
        run: |
          if out=$(docker run --rm brain 2>&1); then echo "booted without variables" >&2; exit 1; fi
          echo "$out" | grep -q "missing required variables: .*DATABASE_URL"
      - name: "Placeholder production set: /readyz 200 within 60s"
        run: |
          # Placeholders only; values from .env.docker.example, production-specific ones overridden.
          set -- --network host --env-file .env.docker.example -e APP_ENV=production \
            -e DATABASE_URL=postgres://loco:loco@localhost:5432/opsagent_brain_prod \
            -e REDIS_URL=redis://localhost:6379 -e MAILER_SMTP_URL=smtp://127.0.0.1:1025 \
            -e OPSAGENT_CONNECTORS=aws -e SIGNUP_ALLOWED_DOMAINS=example.test -e TURNSTILE_SECRET_KEY=placeholder \
            -e OPSAGENT_AWS_OUTBOUND_ROLE_ARN=arn:aws:iam::000000000000:role/placeholder \
            -e OPSAGENT_TEMPLATE_BASE_URL=https://templates.example.test
          docker run --rm "$@" brain opsagent-brain db migrate
          docker run -d --name api "$@" brain
          timeout 60 bash -c 'until curl -sf http://localhost:3000/readyz >/dev/null; do sleep 2; done'
      - if: failure()
        run: docker logs api

  compose-smoke:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: brain-image
      - run: docker load < brain-image.tar.gz && docker tag opsagent-brain:ci opsagent-brain:compose
      - run: docker compose --profile brain up -d --no-build
      - name: Wait for /readyz
        run: timeout 120 bash -c 'until curl -sf http://localhost:3000/readyz >/dev/null; do sleep 2; done'
      - run: scripts/smoke.sh http://localhost:3000
      - if: failure()
        run: docker compose --profile brain logs
      - if: always()
        run: docker compose --profile brain down -v

  # Manual step after a Railway deploy (Railway deploys on push to main itself).
  smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Smoke target must be production (the session cookie is real)
        run: case "$BASE_URL" in https://brain.opsagent.dev|https://brain.opsagent.dev/*) ;; *) echo "base_url must be https://brain.opsagent.dev"; exit 1;; esac
        env:
          BASE_URL: ${{ inputs.base_url }}
      - run: scripts/smoke.sh "$BASE_URL"
        env:
          BASE_URL: ${{ inputs.base_url }}
          SMOKE_ORG_SLUG: ${{ secrets.SMOKE_ORG_SLUG }}
          SMOKE_CONNECTION_ID: ${{ secrets.SMOKE_CONNECTION_ID }}
          SMOKE_ROLE_ARN: ${{ secrets.SMOKE_ROLE_ARN }}
          SMOKE_SESSION_COOKIE: ${{ secrets.SMOKE_SESSION_COOKIE }}
