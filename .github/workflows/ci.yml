name: ci
on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  DATABASE_URL: postgres://loco:loco@localhost:5432/opsagent_brain_test
  REDIS_URL: redis://localhost:6379

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: loco
          POSTGRES_PASSWORD: loco
          POSTGRES_DB: opsagent_brain_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U loco" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: scripts/check-crate-isolation.sh
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: scripts/openapi-diff.sh
      - run: cargo install cargo-audit --locked
      - run: cargo audit
