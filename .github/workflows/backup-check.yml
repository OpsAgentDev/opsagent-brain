name: backup-check
# The nightly backup task on AWS (03:00 UTC) has no watchdog of its own. This fails, and so emails the
# repo watchers, when the newest dump in the bucket is older than 36 hours or there is none.
on:
  schedule:
    - cron: "30 9 * * *"
  workflow_dispatch:

permissions:
  id-token: write # GitHub OIDC: a read-only role, no AWS keys

jobs:
  newest-dump:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BUCKET: ${{ vars.BACKUP_BUCKET }}
      ROLE_ARN: ${{ vars.BACKUP_CHECK_ROLE_ARN }}
      AWS_DEFAULT_REGION: us-west-2
    steps:
      - name: Newest dump is under 36 hours old
        run: |
          token="$(curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)"
          creds="$(aws sts assume-role-with-web-identity --role-arn "$ROLE_ARN" \
            --role-session-name "backup-check-$GITHUB_RUN_ID" --web-identity-token "$token" \
            --query Credentials --output json)"
          AWS_ACCESS_KEY_ID="$(jq -r .AccessKeyId <<<"$creds")"
          AWS_SECRET_ACCESS_KEY="$(jq -r .SecretAccessKey <<<"$creds")"
          AWS_SESSION_TOKEN="$(jq -r .SessionToken <<<"$creds")"
          echo "::add-mask::$AWS_SECRET_ACCESS_KEY"; echo "::add-mask::$AWS_SESSION_TOKEN"
          export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN
          newest=$(aws s3api list-objects-v2 --bucket "$BUCKET" --prefix postgres/ \
            --query 'sort_by(Contents,&LastModified)[-1].LastModified' --output text)
          if [ -z "$newest" ] || [ "$newest" = "None" ]; then echo "::error::no dump in the bucket"; exit 1; fi
          age=$(( $(date +%s) - $(date -d "$newest" +%s) ))
          echo "newest dump: $newest ($((age / 3600)) h old)"
          if [ "$age" -gt $((36 * 3600)) ]; then echo "::error::newest dump is $((age / 3600)) h old (limit 36 h)"; exit 1; fi
