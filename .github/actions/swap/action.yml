name: Add swap
description: Extra swap so the AWS SDK crates compile on the small private-repo runner (it is otherwise shut down for memory).
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo fallocate -l 8G /swapfile-ci
        sudo chmod 600 /swapfile-ci
        sudo mkswap /swapfile-ci >/dev/null
        sudo swapon /swapfile-ci
        free -h
