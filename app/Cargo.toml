[package]
name = "opsagent-brain"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "opsagent-brain"

[dependencies]
loco-rs = { workspace = true, features = ["worker_redis"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sea-orm = { version = "2.0", default-features = false, features = ["macros", "with-uuid", "with-chrono", "with-json", "with-rust_decimal"] }
tracing = "0.1"
tokio = { version = "1.45", default-features = false, features = ["rt-multi-thread"] }
async-trait = "0.1"
axum = "0.8"
redis = { version = "1", default-features = false, features = ["aio", "tokio-comp"] }
migration = { path = "migration" }
tower-sessions = "0.15"
time = "0.3"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
oauth2 = { version = "5", default-features = false, features = ["reqwest", "rustls-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = "0.4"
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
opsagent-checks = { path = "../crates/checks" }
opsagent-secrets = { path = "../crates/secrets" }
opsagent-core = { path = "../crates/core" }
opsagent-ledger = { path = "../crates/ledger" }
opsagent-connectors = { path = "../crates/connectors" }
urlencoding = "2"
zeroize = "1"
cron = "0.17.0"
utoipa = { version = "6", features = ["chrono", "uuid", "decimal"] }
utoipa-axum = "0.3"

[[bin]]
name = "opsagent-brain"
path = "src/bin/main.rs"

[dev-dependencies]
loco-rs = { workspace = true, features = ["testing"] }
serial_test = "3.1.1"
axum-test = "17"

# loco_rs::Error is framework-owned; it crosses clippy's size limit once aws-smithy enables
# serde_json/preserve_order in the unified workspace build.
[lints.clippy]
result_large_err = "allow"
