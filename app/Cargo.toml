[package]
name = "opsagent-brain"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "opsagent-brain"

[dependencies]
loco-rs = { workspace = true, features = ["worker_redis"] }
serde_json = "1"
tokio = { version = "1.45", default-features = false, features = ["rt-multi-thread"] }
async-trait = "0.1"
axum = "0.8"
redis = { version = "1", default-features = false, features = ["aio", "tokio-comp"] }
migration = { path = "migration" }

[[bin]]
name = "opsagent-brain"
path = "src/bin/main.rs"

[dev-dependencies]
loco-rs = { workspace = true, features = ["testing"] }
serial_test = "3.1.1"
